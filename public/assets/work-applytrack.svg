<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="at-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0820"/>
      <stop offset="50%" stop-color="#1B1038"/>
      <stop offset="100%" stop-color="#3B1578"/>
    </linearGradient>
    <radialGradient id="at-glow" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1B1038" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="at-glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E0820" stop-opacity="0"/>
    </radialGradient>
    <pattern id="at-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="at-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#at-bg)"/>
  <rect width="1000" height="1000" fill="url(#at-grid)"/>
  <rect width="1000" height="1000" fill="url(#at-glow)"/>
  <rect width="1000" height="1000" fill="url(#at-glow2)"/>

  <!-- Top Category / Subtitle -->
  <text x="80" y="115" font-family="'Neue Montreal', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#DDD6FE">JOB APPLICATION &amp; PIPELINE TRACKER</text>
  <rect x="80" y="135" width="48" height="3" rx="1.5" fill="#A78BFA"/>

  <!-- Pipeline & Interview Management Graphic -->
  <g transform="translate(80, 180)">
    <!-- Top Pipeline Stages -->
    <g transform="translate(0, 0)">
      <!-- Step 1: Applied -->
      <rect x="0" y="0" width="195" height="85" rx="14" fill="#1C1236" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" filter="url(#at-shadow)"/>
      <text x="20" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C4B5FD">APPLIED</text>
      <text x="20" y="66" font-family="'Neue Montreal', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">48</text>
      <circle cx="160" cy="42" r="14" fill="#8B5CF6" fill-opacity="0.2"/>
      <path d="M155 42 L159 46 L167 38" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>

      <!-- Step 2: Screening -->
      <rect x="215" y="0" width="195" height="85" rx="14" fill="#1C1236" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" filter="url(#at-shadow)"/>
      <text x="235" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C4B5FD">SCREENING</text>
      <text x="235" y="66" font-family="'Neue Montreal', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">16</text>
      <circle cx="375" cy="42" r="14" fill="#8B5CF6" fill-opacity="0.2"/>
      <path d="M370 42 L374 46 L382 38" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>

      <!-- Step 3: Interview (Active) -->
      <rect x="430" y="0" width="195" height="85" rx="14" fill="#2E1854" fill-opacity="0.9" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2" filter="url(#at-shadow)"/>
      <text x="450" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#DDD6FE">INTERVIEWS</text>
      <text x="450" y="66" font-family="'Neue Montreal', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">7</text>
      <rect x="560" y="26" width="50" height="22" rx="11" fill="#8B5CF6"/>
      <text x="585" y="41" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">LIVE</text>

      <!-- Step 4: Offers -->
      <rect x="645" y="0" width="195" height="85" rx="14" fill="#152822" fill-opacity="0.85" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" filter="url(#at-shadow)"/>
      <text x="665" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6EE7B7">OFFERS</text>
      <text x="665" y="66" font-family="'Neue Montreal', system-ui, sans-serif" font-size="28" font-weight="800" fill="#A7F3D0">2</text>
      <circle cx="805" cy="42" r="14" fill="#10B981" fill-opacity="0.25"/>
      <path d="M800 42 L804 46 L812 38" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Main Detail Card: Upcoming Interview & Application Details -->
    <g transform="translate(0, 110)">
      <rect width="520" height="415" rx="18" fill="#180F30" fill-opacity="0.85" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" filter="url(#at-shadow)"/>
      <rect x="28" y="28" width="115" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.25"/>
      <text x="85" y="45" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">NEXT ROUND</text>

      <text x="28" y="95" font-family="'Neue Montreal', system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Full-Stack Engineer</text>
      <text x="28" y="125" font-family="'Neue Montreal', system-ui, sans-serif" font-size="16" font-weight="500" fill="#A78BFA">Stripe · Platform Infrastructure</text>

      <line x1="28" y1="155" x2="492" y2="155" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

      <!-- Interview Details Schedule -->
      <g transform="translate(28, 180)">
        <circle cx="16" cy="16" r="16" fill="#8B5CF6" fill-opacity="0.2"/>
        <path d="M12 16 L15 19 L21 13" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="14" font-family="'Neue Montreal', system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">System Architecture Interview</text>
        <text x="46" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Today at 4:00 PM IST · Google Meet</text>
      </g>

      <g transform="translate(28, 245)">
        <circle cx="16" cy="16" r="16" fill="#8B5CF6" fill-opacity="0.2"/>
        <path d="M10 16 H22 M16 10 V22" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="14" font-family="'Neue Montreal', system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Take-Home Code Submission</text>
        <text x="46" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Approved &amp; Accepted · Score 96%</text>
      </g>

      <!-- Key tags -->
      <g transform="translate(28, 330)">
        <rect x="0" y="0" width="85" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="42" y="18" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">React.js</text>
        <rect x="95" y="0" width="90" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="140" y="18" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Express.js</text>
        <rect x="195" y="0" width="105" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="247" y="18" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>

    <!-- Side Metrics Card -->
    <g transform="translate(545, 110)">
      <rect width="295" height="200" rx="18" fill="#180F30" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.5" filter="url(#at-shadow)"/>
      <text x="24" y="38" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#C4B5FD">RESPONSE RATE</text>
      <text x="24" y="90" font-family="'Neue Montreal', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">33.3%</text>
      <text x="24" y="125" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="500" fill="#34D399">▲ +12% vs. tech average</text>
      <rect x="24" y="150" width="247" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="24" y="150" width="82" height="8" rx="4" fill="#8B5CF6"/>
    </g>

    <g transform="translate(545, 325)">
      <rect width="295" height="200" rx="18" fill="#180F30" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.5" filter="url(#at-shadow)"/>
      <text x="24" y="38" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#C4B5FD">INTERVIEW RATIO</text>
      <text x="24" y="90" font-family="'Neue Montreal', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">43.8%</text>
      <text x="24" y="125" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="500" fill="#A78BFA">7 of 16 screens passed</text>
      <rect x="24" y="150" width="247" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="24" y="150" width="108" height="8" rx="4" fill="#A78BFA"/>
    </g>
  </g>

  <!-- Big Title at Bottom -->
  <text x="80" y="915" font-family="'Neue Montreal', system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" letter-spacing="-1" fill="#FFFFFF">ApplyTrack</text>
</svg>
