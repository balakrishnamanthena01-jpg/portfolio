<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0B172E"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="df-glow" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="df-glow2" cx="20%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070D18" stop-opacity="0"/>
    </radialGradient>
    <pattern id="df-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <filter id="df-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#df-bg)"/>
  <rect width="1000" height="1000" fill="url(#df-grid)"/>
  <rect width="1000" height="1000" fill="url(#df-glow)"/>
  <rect width="1000" height="1000" fill="url(#df-glow2)"/>

  <!-- Top Category / Subtitle -->
  <text x="80" y="115" font-family="'Neue Montreal', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#7DD3FC">PROJECT &amp; TEAM MANAGEMENT</text>
  <rect x="80" y="135" width="48" height="3" rx="1.5" fill="#38BDF8"/>

  <!-- Kanban & Collaboration Graphics Area (y: 200 - 780) -->
  <g transform="translate(80, 180)">
    <!-- Column 1: Backlog / To Do -->
    <rect x="0" y="0" width="255" height="520" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="24" y="42" font-family="'Neue Montreal', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#94A3B8">TO DO</text>
    <rect x="180" y="24" width="48" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="204" y="41" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">3</text>

    <!-- Card 1.1 -->
    <g transform="translate(18, 65)">
      <rect width="219" height="120" rx="14" fill="#0E1E38" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" filter="url(#df-shadow)"/>
      <rect x="16" y="18" width="68" height="20" rx="10" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="50" y="32" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">API DESIGN</text>
      <text x="16" y="64" font-family="'Neue Montreal', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Auth Middleware</text>
      <circle cx="28" cy="95" r="10" fill="#38BDF8"/>
      <text x="28" y="99" font-family="'Neue Montreal', system-ui, sans-serif" font-size="10" font-weight="800" fill="#070D18" text-anchor="middle">BK</text>
      <circle cx="50" cy="95" r="10" fill="#60A5FA"/>
      <text x="50" y="99" font-family="'Neue Montreal', system-ui, sans-serif" font-size="10" font-weight="800" fill="#070D18" text-anchor="middle">JS</text>
    </g>

    <!-- Card 1.2 -->
    <g transform="translate(18, 202)">
      <rect width="219" height="100" rx="14" fill="#0E1E38" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="16" y="16" width="60" height="20" rx="10" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="46" y="30" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle">DEV-42</text>
      <text x="16" y="58" font-family="'Neue Montreal', system-ui, sans-serif" font-size="14" font-weight="500" fill="#CBD5E1">Schema Migration</text>
      <rect x="16" y="74" width="120" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="16" y="74" width="40" height="6" rx="3" fill="#F59E0B"/>
    </g>

    <!-- Column 2: In Progress (Featured) -->
    <rect x="285" y="0" width="275" height="520" rx="20" fill="#13274F" fill-opacity="0.5" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
    <text x="310" y="42" font-family="'Neue Montreal', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#7DD3FC">IN PROGRESS</text>
    <rect x="495" y="24" width="48" height="24" rx="12" fill="#38BDF8" fill-opacity="0.25"/>
    <text x="519" y="41" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="700" fill="#BAE6FD" text-anchor="middle">2</text>

    <!-- Card 2.1 (Active Hero Card) -->
    <g transform="translate(303, 65)">
      <rect width="239" height="195" rx="16" fill="#0C1B33" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="2" filter="url(#df-shadow)"/>
      <rect x="16" y="18" width="80" height="22" rx="11" fill="#2563EB" fill-opacity="0.35"/>
      <text x="56" y="33" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">HIGH PRIORITY</text>
      <text x="16" y="68" font-family="'Neue Montreal', system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Kanban Board Sync</text>
      <text x="16" y="90" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Real-time WebSocket event bus</text>

      <!-- Progress -->
      <rect x="16" y="118" width="207" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="16" y="118" width="160" height="8" rx="4" fill="#38BDF8"/>
      <text x="16" y="146" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="600" fill="#BAE6FD">Progress: 78%</text>
      <text x="195" y="146" font-family="'Neue Montreal', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">3/4 Done</text>

      <!-- Assignees -->
      <g transform="translate(16, 158)">
        <circle cx="12" cy="12" r="12" fill="#38BDF8"/>
        <text x="12" y="16" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="800" fill="#070D18" text-anchor="middle">BK</text>
        <circle cx="32" cy="12" r="12" fill="#818CF8"/>
        <text x="32" y="16" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="800" fill="#070D18" text-anchor="middle">AL</text>
        <rect x="125" y="0" width="82" height="24" rx="12" fill="#38BDF8" fill-opacity="0.18"/>
        <text x="166" y="16" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Sprint 12</text>
      </g>
    </g>

    <!-- Card 2.2 -->
    <g transform="translate(303, 280)">
      <rect width="239" height="110" rx="14" fill="#0E1E38" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.5"/>
      <rect x="16" y="16" width="70" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
      <text x="51" y="30" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">REST API</text>
      <text x="16" y="60" font-family="'Neue Montreal', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Team Roles &amp; Perms</text>
      <rect x="16" y="78" width="207" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="16" y="78" width="95" height="6" rx="3" fill="#10B981"/>
    </g>

    <!-- Column 3: Completed / Done -->
    <rect x="585" y="0" width="255" height="520" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="610" y="42" font-family="'Neue Montreal', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#10B981">DONE</text>
    <rect x="770" y="24" width="48" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
    <text x="794" y="41" font-family="'Neue Montreal', system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">8</text>

    <!-- Card 3.1 -->
    <g transform="translate(603, 65)">
      <rect width="219" height="95" rx="14" fill="#0A1E26" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="16" width="60" height="20" rx="10" fill="#10B981" fill-opacity="0.25"/>
      <text x="46" y="30" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">TESTED</text>
      <text x="16" y="58" font-family="'Neue Montreal', system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Task Filtering UI</text>
      <path d="M185 68 L192 75 L205 60" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Card 3.2 -->
    <g transform="translate(603, 178)">
      <rect width="219" height="95" rx="14" fill="#0A1E26" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="16" width="60" height="20" rx="10" fill="#10B981" fill-opacity="0.25"/>
      <text x="46" y="30" font-family="'Neue Montreal', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">RELEASE</text>
      <text x="16" y="58" font-family="'Neue Montreal', system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Workspace Invite</text>
      <path d="M185 68 L192 75 L205 60" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Connecting Agile Velocity Curve -->
    <path d="M125 450 Q 420 380 710 440" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.5"/>
    <circle cx="420" cy="405" r="5" fill="#38BDF8"/>
  </g>

  <!-- Big Title at Bottom -->
  <text x="80" y="915" font-family="'Neue Montreal', system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" letter-spacing="-1" fill="#FFFFFF">DevFlow</text>
</svg>
